<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SikaGest Suivi</title>
<style>
:root{--bg:#f6f4f0;--surface:#fff;--s2:#faf8f5;--line:#e7e2da;--line2:#d9d2c7;--ink:#1f1b16;--ink2:#5c554c;--ink3:#8d857a;--brand:#e8930c;--brand2:#c97a00;--brandsoft:#fdf1dc;--side:#1d1a17;--ok:#1f8a4c;--oksoft:#e3f4ea;--bad:#c0362c;--badsoft:#fbe6e3;--font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;--mono:ui-monospace,Consolas,"Cascadia Mono",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#161412;--surface:#201d1a;--s2:#272320;--line:#36312c;--line2:#48413a;--ink:#f1ece4;--ink2:#c3baae;--ink3:#8f877b;--brandsoft:#3a2a10;--oksoft:#14301f;--badsoft:#3a1a16}}
a{color:var(--brand2)}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font)}
button,input,textarea,select{font:inherit;color:inherit}
.top{background:var(--side);color:#fff;display:flex;align-items:center;gap:12px;padding:14px 24px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--brand);display:grid;place-items:center;color:#1d1a17;font-weight:800;font-size:18px}
.top b{font-size:16px}.top span{color:#a39a8e;font-size:13px}.top .sp{flex:1}
.wrap{max-width:1080px;margin:0 auto;padding:22px 16px 60px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:600}
.tabs button.on{color:var(--ink);border-bottom-color:var(--brand)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:16px}.hint{color:var(--ink3);margin:0 0 14px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--surface);padding:8px 14px;border-radius:7px;cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink3)}.btn.primary{background:var(--brand);border-color:var(--brand);color:#1d1a17}.btn.primary:hover{background:var(--brand2)}
.btn.sm{padding:4px 10px;font-size:13px}.btn.danger{color:var(--bad)}
.input{width:100%;border:1px solid var(--line2);background:var(--surface);border-radius:7px;padding:9px 11px;outline:none}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(232,147,12,.2)}
.mono{font-family:var(--mono);letter-spacing:.5px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin:0 0 5px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}.full{grid-column:1/-1}
@media (max-width:640px){.grid{grid-template-columns:1fr}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.msg{padding:10px 12px;border-radius:8px;margin-top:12px}.msg.ok{background:var(--oksoft);color:var(--ok)}.msg.bad{background:var(--badsoft);color:var(--bad)}
.out{background:var(--s2);border:1px dashed var(--line2);border-radius:8px;padding:14px;word-break:break-all;font-family:var(--mono);font-size:15px;line-height:1.6;margin:12px 0}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);padding:9px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:0}
.tablewrap{overflow-x:auto}
.lock{min-height:100vh;display:grid;place-items:center;padding:16px}.lock .card{width:min(440px,100%)}
.tag{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:600;background:var(--brandsoft);color:var(--brand2)}
dialog{border:0;border-radius:12px;padding:0;width:min(560px,94vw);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}dialog .card{margin:0;border:0}
</style>
<style>@media (max-width:700px){.top span{display:none} th:nth-child(6),td:nth-child(6),th:nth-child(7),td:nth-child(7){display:none}}</style>

<body>
<div class="top"><div class="mark">S</div><div><b>SikaGest Suivi</b><br><span>Vos clients, leurs licences et leurs installations, en direct</span></div><div class="sp"></div></div>
<div class="wrap"><div class="tabs" id="tabs" hidden><button data-t="live">Clients</button><button data-t="site">Mon site</button><button data-t="account">Mon compte</button><a class="btn sm" id="sitelink" target="_blank" rel="noopener" style="margin:0 0 6px auto">Voir mon site ↗</a></div><div id="view"></div></div>
<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ALPHA = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
function b32enc(bytes) { let bits = 0, v = 0, o = ''; for (const b of bytes) { v = (v << 8) | b; bits += 8; while (bits >= 5) { o += ALPHA[(v >>> (bits - 5)) & 31]; bits -= 5; } } if (bits > 0) o += ALPHA[(v << (5 - bits)) & 31]; return o; }
function b32dec(str) { const s = String(str || '').toUpperCase().replace(/[^0-9A-Z]/g, '').replace(/[IL]/g, '1').replace(/O/g, '0'); let bits = 0, v = 0; const o = []; for (const ch of s) { const i = ALPHA.indexOf(ch); if (i < 0) return null; v = (v << 5) | i; bits += 5; if (bits >= 8) { o.push((v >>> (bits - 8)) & 255); bits -= 8; } } return new Uint8Array(o); }
const hex = (u8) => Array.from(u8, (b) => b.toString(16).padStart(2, '0')).join('');
const unhex = (h) => new Uint8Array(h.match(/../g).map((x) => parseInt(x, 16)));
const group = (s) => s.match(/.{1,4}/g).join('-');
const b64 = (u8) => btoa(String.fromCharCode(...u8));
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const installCode = (idHex) => group(b32enc(unhex(idHex)));
const today = () => new Date().toISOString().slice(0, 10);
const nowStr = () => { const d = new Date(); return d.toLocaleDateString('fr-FR') + ' ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }); };


// ---------- Installations en direct (serveur en ligne) ----------
const SERVER = { url: 'https://amyeajnxdeeynxdveahu.supabase.co', key: 'sb_publishable_ruU1tjtP1wTh7IpIaA60FA_UjKPK7IQ' };
const AUTH_KEY = 'sikagest-admin-auth-v1';
const LIVE = { rows: null, q: '', city: '', lic: '' };
let liveTimer = null;
function getAuth() { try { return JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); } catch (e) { return null; } }
function setAuth(a) { try { a ? localStorage.setItem(AUTH_KEY, JSON.stringify(a)) : localStorage.removeItem(AUTH_KEY); } catch (e) { /* rien */ } }
const NET_ERR = 'Impossible de joindre le serveur. Vérifiez votre connexion Internet et réessayez dans un instant.';
async function safeFetch(url, opts) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 20000);
  try { return await fetch(url, { ...opts, signal: ctl.signal }); } catch (e) { throw new Error(NET_ERR); } finally { clearTimeout(t); }
}
async function authCall(path, body, method = 'POST', bearer = null) {
  const r = await safeFetch(`${SERVER.url}/auth/v1/${path}`, { method, headers: { apikey: SERVER.key, 'Content-Type': 'application/json', ...(bearer ? { Authorization: `Bearer ${bearer}` } : {}) }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error_description || j.msg || j.message || `Erreur ${r.status}`);
  return j;
}
function keepAuth(j) { setAuth({ access: j.access_token, refresh: j.refresh_token, exp: Date.now() + (j.expires_in || 3600) * 1000 - 60000, email: j.user && j.user.email }); }
async function token() {
  const a = getAuth(); if (!a) return null;
  if (Date.now() < a.exp) return a.access;
  try { keepAuth(await authCall('token?grant_type=refresh_token', { refresh_token: a.refresh })); return getAuth().access; }
  catch (e) { setAuth(null); return null; }
}
async function api(path, opts = {}) {
  const t = await token(); if (!t) throw new Error('auth');
  const r = await safeFetch(`${SERVER.url}/rest/v1/${path}`, { ...opts, headers: { apikey: SERVER.key, Authorization: `Bearer ${t}`, 'Content-Type': 'application/json', ...(opts.headers || {}) } });
  if (r.status === 401) { setAuth(null); throw new Error('auth'); }
  if (!r.ok) throw new Error(`Erreur serveur ${r.status}`);
  return r.status === 204 ? null : r.json();
}
const ago = (iso) => {
  const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 1) return "à l'instant"; if (m < 60) return `il y a ${m} min`;
  const h = Math.round(m / 60); if (h < 24) return `il y a ${h} h`;
  const d = Math.round(h / 24); return d < 31 ? `il y a ${d} j` : new Date(iso).toLocaleDateString('fr-FR');
};
const waLink = (phone, text) => { let n = String(phone || '').replace(/[^0-9]/g, ''); if (n.length === 10) n = '225' + n; return `https://wa.me/${n}?text=${encodeURIComponent(text || '')}`; };

async function viewLive() {
  if (!(await token())) return viewLogin();
  $('#view').innerHTML = `<div class="card" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px" id="kpis"><span class="hint">Chargement…</span></div>
    <div class="card"><div class="row" style="margin-bottom:12px"><h2 style="flex:1">Vos clients SikaGest</h2>
      <input class="input" id="lq" placeholder="Nom, téléphone, quartier…" style="max-width:240px" value="${esc(LIVE.q)}">
      <select class="input" id="lc" style="max-width:180px"></select>
      <select class="input" id="ll" style="max-width:190px"><option value="">Toutes les licences</option><option value="trial">En essai</option><option value="active">Payées (actives)</option><option value="soon">Expirent sous 15 jours</option><option value="expired">Expirées</option></select>
      <button class="btn" id="lcsv">Exporter (Excel)</button><button class="btn" id="lpw">Mot de passe</button><button class="btn" id="lout">Déconnexion</button></div>
      <div class="tablewrap"><table><thead><tr><th>Entreprise</th><th>Gérant</th><th>Contact</th><th>Zone</th><th>Licence</th><th>Version</th><th>Installé</th><th>Activité récente</th><th></th></tr></thead><tbody id="ltb"></tbody></table></div>
      <p class="hint" style="margin:10px 0 0" id="lupd"></p></div>`;
  $('#lq').addEventListener('input', (e) => { LIVE.q = e.target.value; drawLive(); });
  $('#lc').addEventListener('change', (e) => { LIVE.city = e.target.value; drawLive(); });
  $('#ll').value = LIVE.lic;
  $('#ll').addEventListener('change', (e) => { LIVE.lic = e.target.value; drawLive(); });
  $('#lpw').addEventListener('click', changeServerPassword);
  $('#lout').addEventListener('click', () => { setAuth(null); LIVE.rows = null; render(); });
  $('#lcsv').addEventListener('click', () => {
    const rows = filteredLive();
    const cell = (v) => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
    const csv = '﻿' + [['Entreprise', 'Gérant', 'Téléphone', 'E-mail', 'Ville', 'Quartier', 'Activité', 'Licence', 'Expire le', 'Version', 'Installé le', 'Dernière activité', 'Identifiant', 'Notes'],
      ...rows.map((r) => [r.shop, r.owner_name, r.phone, r.email, r.city, r.district, r.activity, r.license_state === 'active' ? (r.license_plan || 'Payée') : (r.license_state || ''), r.license_expires || '', r.app_version, (r.first_seen || '').slice(0, 10), new Date(r.last_seen).toLocaleString('fr-FR'), installCode(r.install_id), r.notes])].map((r) => r.map(cell).join(';')).join('\r\n');
    download(`clients-sikagest-${today()}.csv`, csv, 'text/csv');
  });
  await loadLive();
  if (liveTimer) clearInterval(liveTimer);
  liveTimer = setInterval(loadLive, 60000);
}
async function loadLive() {
  try { LIVE.rows = await api('installations?select=*&order=last_seen.desc'); }
  catch (e) { if (e.message === 'auth') return viewLogin(); if ($('#lupd')) $('#lupd').textContent = 'Impossible de joindre le serveur (pas d\'Internet ?). Nouvel essai dans 1 minute.'; return; }
  if (!$('#ltb')) return;
  const rows = LIVE.rows, now = Date.now();
  const online = rows.filter((r) => now - new Date(r.last_seen) < 30 * 60000).length;
  const week = rows.filter((r) => now - new Date(r.first_seen) < 7 * 864e5).length;
  const cities = {}; rows.forEach((r) => { const c = (r.city || 'Non renseignée').trim(); cities[c] = (cities[c] || 0) + 1; });
  const k = (label, val, sub = '') => `<div><div class="hint" style="margin:0;text-transform:uppercase;font-size:11.5px;letter-spacing:.6px;font-weight:600">${label}</div><div style="font-size:24px;font-weight:700">${val}</div><div class="hint" style="margin:0">${sub}</div></div>`;
  const paid = rows.filter((r) => r.license_state === 'active').length, trials = rows.filter((r) => r.license_state === 'trial').length;
  const soon = rows.filter((r) => licSoon(r)).length;
  $('#kpis').innerHTML = k('Installations', rows.length, `${online} ouverte(s) en ce moment`) + k('Licences payées', paid, `${trials} en essai`) + k('À relancer', soon, 'expirent sous 15 jours ou expirées') + k('Nouvelles cette semaine', week) +
    k('Villes', Object.keys(cities).length, Object.entries(cities).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([c, n]) => `${esc(c)} (${n})`).join(', '));
  const sel = $('#lc');
  sel.innerHTML = '<option value="">Toutes les villes</option>' + Object.keys(cities).sort().map((c) => `<option ${c === LIVE.city ? 'selected' : ''}>${esc(c)}</option>`).join('');
  $('#lupd').textContent = `Mis à jour à ${new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })} · actualisation automatique chaque minute.`;
  drawLive();
}
const daysTo = (iso) => Math.round((new Date(`${iso}T12:00:00`) - new Date(`${today()}T12:00:00`)) / 864e5);
function licSoon(r) { return r.license_state === 'expired' || (r.license_expires && daysTo(r.license_expires) <= 15); }
function licTag(r) {
  if (!r.license_state) return '<span class="hint">—</span>';
  const exp = r.license_expires ? `<br><span class="hint">${r.license_state === 'expired' ? 'depuis' : 'jusqu\'au'} ${new Date(r.license_expires + 'T12:00:00').toLocaleDateString('fr-FR')}</span>` : (r.license_state === 'active' ? '<br><span class="hint">à vie</span>' : '');
  const style = r.license_state === 'active' ? (licSoon(r) ? 'background:#fff1d6;color:#b26a00' : 'background:var(--oksoft);color:var(--ok)') : r.license_state === 'trial' ? 'background:#e5eef8;color:#2563a8' : 'background:var(--badsoft);color:var(--bad)';
  const label = r.license_state === 'active' ? esc(r.license_plan || 'Payée') : r.license_state === 'trial' ? 'Essai' : 'Expirée';
  return `<span class="tag" style="${style}">${label}</span>${exp}`;
}
function filteredLive() {
  const q = LIVE.q.toLowerCase();
  return (LIVE.rows || []).filter((r) => (!LIVE.lic || (LIVE.lic === 'soon' ? licSoon(r) : r.license_state === LIVE.lic)) && (!LIVE.city || (r.city || 'Non renseignée').trim() === LIVE.city) && (!q || [r.shop, r.owner_name, r.phone, r.city, r.district, r.activity, r.email, installCode(r.install_id)].join(' ').toLowerCase().includes(q)));
}
function drawLive() {
  if (!$('#ltb')) return;
  const now = Date.now();
  const rows = filteredLive();
  $('#ltb').innerHTML = rows.map((r) => {
    const on = now - new Date(r.last_seen) < 30 * 60000, isNew = now - new Date(r.first_seen) < 48 * 3600000;
    return `<tr><td><b>${esc(r.shop || '(sans nom)')}</b> ${isNew ? '<span class="tag">Nouveau</span>' : ''}<br><span class="hint">${esc(r.activity || '')}</span></td>
      <td>${esc(r.owner_name || '')}</td>
      <td>${r.phone ? `${esc(r.phone)}<br><a href="${waLink(r.phone, `Bonjour ${r.owner_name || ''}, c'est votre fournisseur SikaGest.`)}" target="_blank" rel="noopener">WhatsApp</a> · <a href="tel:${esc(r.phone)}">Appeler</a>` : '<span class="hint">—</span>'}${r.email ? `<br><span class="hint">${esc(r.email)}</span>` : ''}</td>
      <td>${esc(r.city || '')}<br><span class="hint">${esc(r.district || '')}</span></td>
      <td>${licTag(r)}</td>
      <td>${esc(r.app_version || '')}${r.portable ? '<br><span class="hint">portable</span>' : ''}</td>
      <td>${new Date(r.first_seen).toLocaleDateString('fr-FR')}</td>
      <td>${on ? '<span class="tag" style="background:var(--oksoft);color:var(--ok)">● En ligne</span>' : esc(ago(r.last_seen))}</td>
      <td><button class="btn sm" data-n="${r.install_id}">Notes</button></td></tr>`;
  }).join('') || '<tr><td colspan="9" class="hint" style="text-align:center;padding:30px">Aucune installation pour le moment. Elles apparaîtront ici dès qu\'un client ouvre SikaGest avec Internet.</td></tr>';
  document.querySelectorAll('[data-n]').forEach((b) => b.addEventListener('click', () => editNotes(b.dataset.n)));
}
function editNotes(id) {
  const r = LIVE.rows.find((x) => x.install_id === id);
  const d = document.createElement('dialog');
  d.innerHTML = `<div class="card"><h2>${esc(r.shop || '(sans nom)')}</h2><p class="hint">Identifiant d'installation : <span class="mono">${installCode(id)}</span></p>
    <label>Vos notes (paiement, nombre de postes, demandes…)</label><textarea class="input" id="nt" rows="5">${esc(r.notes || '')}</textarea>
    <div id="nmsg"></div><div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn danger" id="ndel" style="margin-right:auto">Retirer de la liste</button><button class="btn" id="nc">Annuler</button><button class="btn primary" id="ns">Enregistrer</button></div></div>`;
  document.body.appendChild(d); d.showModal();
  const close = () => { d.close(); d.remove(); };
  $('#nc', d).addEventListener('click', close);
  $('#ns', d).addEventListener('click', async () => {
    try { await api(`installations?install_id=eq.${id}`, { method: 'PATCH', body: JSON.stringify({ notes: $('#nt', d).value }), headers: { Prefer: 'return=minimal' } }); close(); loadLive(); }
    catch (e) { $('#nmsg', d).innerHTML = `<div class="msg bad">${esc(e.message)}</div>`; }
  });
  $('#ndel', d).addEventListener('click', async () => {
    if (!confirm('Retirer cette installation de la liste ? Elle réapparaîtra si le logiciel se reconnecte.')) return;
    try { await api(`installations?install_id=eq.${id}`, { method: 'DELETE', headers: { Prefer: 'return=minimal' } }); close(); loadLive(); }
    catch (e) { $('#nmsg', d).innerHTML = `<div class="msg bad">${esc(e.message)}</div>`; }
  });
}
function viewLogin() {
  if (liveTimer) { clearInterval(liveTimer); liveTimer = null; }
  $('#view').innerHTML = `<div class="card" style="max-width:460px"><h2>Connexion au serveur</h2>
    <p class="hint">Pour voir en direct les installations de vos clients. Utilisez l'e-mail et le mot de passe du serveur qui vous ont été donnés.</p>
    <label>E-mail</label><input class="input" id="le" type="email" value="${esc((getAuth() || {}).email || '')}" placeholder="votre e-mail de connexion">
    <label style="margin-top:10px">Mot de passe du serveur</label><input class="input" id="lp" type="password">
    <div class="row" style="margin-top:14px"><button class="btn primary" id="lgo">Se connecter</button></div><div id="lmsg2"></div></div>`;
  const msg = (t, ok) => { $('#lmsg2').innerHTML = `<div class="msg ${ok ? 'ok' : 'bad'}">${t}</div>`; };
  const go = async () => {
    const b = $('#lgo'); b.disabled = true; b.textContent = 'Connexion…'; $('#lmsg2').innerHTML = '';
    try { keepAuth(await authCall('token?grant_type=password', { email: $('#le').value.trim(), password: $('#lp').value })); viewLive(); }
    catch (e) { b.disabled = false; b.textContent = 'Se connecter'; msg(/invalid/i.test(e.message) ? 'E-mail ou mot de passe incorrect.' : esc(e.message)); }
  };
  $('#lgo').addEventListener('click', go);
  $('#lp').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
  $('#lp').focus();
}
function changeServerPassword() {
  const d = document.createElement('dialog');
  d.innerHTML = `<div class="card"><h2>Changer le mot de passe du serveur</h2><p class="hint">8 caractères minimum.</p>
    <label>Nouveau mot de passe</label><input class="input" type="password" id="np1">
    <label style="margin-top:10px">Confirmer</label><input class="input" type="password" id="np2"><div id="npm"></div>
    <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" id="npc">Annuler</button><button class="btn primary" id="nps">Enregistrer</button></div></div>`;
  document.body.appendChild(d); d.showModal();
  const close = () => { d.close(); d.remove(); };
  $('#npc', d).addEventListener('click', close);
  $('#nps', d).addEventListener('click', async () => {
    const m = (t, ok) => { $('#npm', d).innerHTML = `<div class="msg ${ok ? 'ok' : 'bad'}">${t}</div>`; };
    if ($('#np1', d).value.length < 8) return m('8 caractères minimum.');
    if ($('#np1', d).value !== $('#np2', d).value) return m('Les deux mots de passe sont différents.');
    try { await authCall('user', { password: $('#np1', d).value }, 'PUT', await token()); m('Mot de passe du serveur changé.', true); setTimeout(close, 1200); }
    catch (e) { m(esc(e.message)); }
  });
}

// ---------- Onglets de la page en ligne : Clients / Mon site / Mon compte ----------
let TAB = 'live';
let SITE = null;
const SITE_URL_DEFAULT = new URL('../', location.href).href;
async function loadSite() {
  const r = await safeFetch(`${SERVER.url}/rest/v1/site_settings?id=eq.1&select=*`, { headers: { apikey: SERVER.key } });
  SITE = (await r.json())[0] || {};
  const link = $('#sitelink'); if (link) link.href = SITE.site_url || SITE_URL_DEFAULT;
  return SITE;
}
async function render() {
  const logged = !!(await token());
  $('#tabs').hidden = !logged;
  if (!logged) { $('#tabs').hidden = true; return viewLive(); }
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.t === TAB));
  if (liveTimer && TAB !== 'live') { clearInterval(liveTimer); liveTimer = null; }
  if (!SITE) loadSite().catch(() => {});
  ({ live: viewLive, site: viewSite, account: viewAccount })[TAB]();
}
document.querySelectorAll('#tabs button').forEach((b) => b.addEventListener('click', () => { TAB = b.dataset.t; render(); }));
// après connexion, viewLogin appelle viewLive : on réaffiche les onglets
const _viewLive = viewLive;
viewLive = async function () { if (await token()) { $('#tabs').hidden = false; document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.t === 'live')); if (!SITE) loadSite().catch(() => {}); } return _viewLive(); };

async function viewSite() {
  $('#view').innerHTML = '<div class="card"><span class="hint">Chargement…</span></div>';
  try { await loadSite(); } catch (e) { $('#view').innerHTML = `<div class="card"><div class="msg bad">${esc(e.message)}</div></div>`; return; }
  const v = (k) => esc(SITE[k] ?? '');
  $('#view').innerHTML = `<div class="card"><h2>Mon site et mes numéros</h2>
    <p class="hint">Ces informations s'affichent sur votre site et dans le logiciel SikaGest de vos clients (bouton WhatsApp, numéros de paiement). Les changements sont visibles en quelques secondes, sans nouvelle version.</p>
    <div class="grid">
      <div><label>Numéro WhatsApp (vente et assistance)</label><input class="input" id="s-whatsapp" value="${v('whatsapp')}" placeholder="+225 07 00 00 00 00"></div>
      <div><label>E-mail de contact (facultatif)</label><input class="input" id="s-email" value="${v('email')}" placeholder="contact@…"></div>
      <div><label>Numéro Wave</label><input class="input" id="s-wave" value="${v('wave')}" placeholder="+225 07 00 00 00 00"></div>
      <div><label>Numéro Orange Money</label><input class="input" id="s-orange_money" value="${v('orange_money')}"></div>
      <div><label>Numéro MTN MoMo</label><input class="input" id="s-mtn_momo" value="${v('mtn_momo')}"></div>
      <div></div>
      <div><label>Prix mensuel (FCFA)</label><input class="input" type="number" min="0" id="s-price_mensuel" value="${v('price_mensuel')}" placeholder="vide = « Sur demande »"></div>
      <div><label>Prix annuel (FCFA)</label><input class="input" type="number" min="0" id="s-price_annuel" value="${v('price_annuel')}" placeholder="vide = « Sur demande »"></div>
      <div><label>Prix à vie (FCFA)</label><input class="input" type="number" min="0" id="s-price_vie" value="${v('price_vie')}" placeholder="vide = « Sur demande »"></div>
      <div><label>Adresse de votre site</label><input class="input" id="s-site_url" value="${v('site_url')}" placeholder="${esc(SITE_URL_DEFAULT)}"></div>
    </div>
    <div class="row" style="margin-top:16px"><button class="btn primary" id="s-save">Enregistrer</button><a class="btn" target="_blank" rel="noopener" href="${esc(SITE.site_url || SITE_URL_DEFAULT)}">Voir mon site ↗</a></div><div id="s-msg"></div>
    <p class="hint" style="margin:14px 0 0">Dernière modification : ${SITE.updated_at ? new Date(SITE.updated_at).toLocaleString('fr-FR') : '—'}</p></div>`;
  $('#s-save').addEventListener('click', async () => {
    const txt = (k) => $(`#s-${k}`).value.trim();
    const int = (k) => { const x = $(`#s-${k}`).value.trim(); return x === '' ? null : Math.max(0, Math.round(Number(x))); };
    const body = { whatsapp: txt('whatsapp'), email: txt('email'), wave: txt('wave'), orange_money: txt('orange_money'), mtn_momo: txt('mtn_momo'),
      price_mensuel: int('price_mensuel'), price_annuel: int('price_annuel'), price_vie: int('price_vie'), site_url: txt('site_url'), updated_at: new Date().toISOString() };
    if (body.whatsapp && body.whatsapp.replace(/[^0-9]/g, '').length < 8) { $('#s-msg').innerHTML = '<div class="msg bad">Numéro WhatsApp trop court.</div>'; return; }
    try {
      await api('site_settings?id=eq.1', { method: 'PATCH', body: JSON.stringify(body), headers: { Prefer: 'return=minimal' } });
      SITE = null; await loadSite();
      $('#s-msg').innerHTML = '<div class="msg ok">Enregistré. Votre site et le logiciel de vos clients afficheront ces informations.</div>';
    } catch (e) { $('#s-msg').innerHTML = `<div class="msg bad">${esc(e.message === 'auth' ? 'Session expirée : reconnectez-vous.' : e.message)}</div>`; }
  });
}

function viewAccount() {
  const a = getAuth() || {};
  $('#view').innerHTML = `<div class="grid" style="align-items:start">
    <div class="card"><h2>E-mail de connexion</h2><p class="hint">Actuel : <b>${esc(a.email || '')}</b></p>
      <label>Nouvel e-mail</label><input class="input" type="email" id="a-email" placeholder="ex. : admin.sikagest@gmail.com">
      <div class="row" style="margin-top:12px"><button class="btn primary" id="a-email-go">Changer l'e-mail</button></div><div id="a-email-msg"></div>
      <p class="hint" style="margin:12px 0 0">Un lien de confirmation est envoyé à l'ancienne et à la nouvelle adresse. Cliquez sur les deux liens : le changement est fait après le second clic.</p></div>
    <div class="card"><h2>Mot de passe</h2><p class="hint">8 caractères minimum.</p>
      <label>Nouveau mot de passe</label><input class="input" type="password" id="a-p1">
      <label style="margin-top:10px">Confirmer</label><input class="input" type="password" id="a-p2">
      <div class="row" style="margin-top:12px"><button class="btn primary" id="a-pw-go">Changer le mot de passe</button></div><div id="a-pw-msg"></div></div></div>`;
  $('#a-email-go').addEventListener('click', async () => {
    const m = (t, ok) => { $('#a-email-msg').innerHTML = `<div class="msg ${ok ? 'ok' : 'bad'}">${t}</div>`; };
    const email = $('#a-email').value.trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return m('Adresse e-mail invalide.');
    try { await authCall('user', { email }, 'PUT', await token()); m(`Liens de confirmation envoyés à ${esc(a.email)} et à ${esc(email)}. Cliquez sur les deux, puis reconnectez-vous avec la nouvelle adresse.`, true); }
    catch (e) { m(esc(e.message)); }
  });
  $('#a-pw-go').addEventListener('click', async () => {
    const m = (t, ok) => { $('#a-pw-msg').innerHTML = `<div class="msg ${ok ? 'ok' : 'bad'}">${t}</div>`; };
    if ($('#a-p1').value.length < 8) return m('8 caractères minimum.');
    if ($('#a-p1').value !== $('#a-p2').value) return m('Les deux mots de passe sont différents.');
    try { await authCall('user', { password: $('#a-p1').value }, 'PUT', await token()); m('Mot de passe changé.', true); $('#a-p1').value = $('#a-p2').value = ''; }
    catch (e) { m(esc(e.message)); }
  });
}
render();

</script>
</body>
</html>
